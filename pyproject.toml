[project]
name = "ledger"
version = "0.1.0"
description = "简单命令行记账工具"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
ledger = "ledger.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ledger*"]
